# Dependabot version updates. Security updates are enabled separately (see
# .github/setup-repo.sh) and do not depend on this file.
version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows/ current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Python dependencies in pyproject.toml and uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns: ["*"]
    # FastMCP is pinned to 4.x; a new major needs a deliberate upgrade.
    ignore:
      - dependency-name: fastmcp
        update-types: ["version-update:semver-major"]

  # Base images in the Dockerfile, pinned by digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      images:
        patterns: ["*"]
