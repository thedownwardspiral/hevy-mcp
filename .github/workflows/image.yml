# Builds the container image and publishes it to GHCR.
#
# Pull requests only build it. Pushes to main publish `latest`, `v*` tags
# publish the version, and both publish `sha-<short sha>`. The test suite runs
# first, so a failing build never reaches GHCR.
name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    # The workspace-relative form, not the newer `$/` self-repository syntax.
    uses: ./.github/workflows/test.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Add linux/arm64 to platforms if the Docker host is ARM.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Start the built image on pull requests and wait for its health check.
      - if: github.event_name == 'pull_request'
        name: Smoke test
        env:
          TAG: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          docker run -d --name hevy-mcp --read-only --tmpfs /tmp \
            -e HEVY_API_KEY=00000000-0000-4000-8000-000000000000 "$TAG"
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' hevy-mcp)
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs hevy-mcp
          echo "container did not become healthy: $status" >&2
          exit 1
