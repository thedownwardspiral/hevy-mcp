# Scans each commit for secrets before it leaves your machine. On private
# repos this stands in for GitHub push protection, which personal accounts
# cannot use there. Enable it once per clone:
#
#   pipx install pre-commit
#   pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks
