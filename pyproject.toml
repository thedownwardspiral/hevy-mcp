[project]
name = "hevy-mcp"
version = "0.1.0"
description = "MCP server for Hevy workout and body-measurement data, read-only unless writes are enabled"
authors = [
    { name = "thedownwardspiral", email = "12749614+thedownwardspiral@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp[apps]>=4.2.5,<5",
    "httpx>=0.28.1",
    "prefab-ui==0.21.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
]

[project.scripts]
hevy-mcp = "hevy_mcp.server:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
